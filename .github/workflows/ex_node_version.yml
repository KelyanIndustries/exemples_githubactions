name: Node version

on:
  workflow_dispatch:

jobs:
  node-version:
    runs-on: ubuntu-${{ matrix.version_ubuntu }}.04
    strategy:
      fail-fast: false
      matrix:
        version_ubuntu: [22, 24]
        version_node: [18, 20, 22]
    steps:
      - uses: actions/setup-node@v6.1.0
        with:
          node-version: ${{ matrix.version_node }}
      - name: Afficher la version de Node.js
        run: node --version
